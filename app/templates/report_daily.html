{% extends "base.html" %}
{% block content %}
<h1>Daily Report</h1>
<p class="muted">Date: <strong>{{ report_date }}</strong></p>

<table>
    <tr><th>Number of users</th><td id="users-count">{{ users }}</td></tr>
    <tr><th>Number of correct guesses</th><td id="correct-count">{{ correct }}</td></tr>
</table>

<a class="back-link" href="{{ url_for('reports.dashboard') }}">&larr; Back to dashboard</a>
{% endblock %}
