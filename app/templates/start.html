{% extends "base.html" %}
{% block content %}
<h1>Guess the Word</h1>
<p>Words remaining today: <strong>{{ remaining }}</strong> of {{ max_games }}</p>

{% if remaining > 0 %}
<form method="POST" action="{{ url_for('game.new_game') }}">
    <button type="submit">Start Game</button>
</form>
{% else %}
<p>You have played all your words for today. Come back tomorrow!</p>
{% endif %}

<p><a href="{{ url_for('auth.logout') }}">Logout</a></p>
{% endblock %}
